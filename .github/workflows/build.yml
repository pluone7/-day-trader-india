name: build
on:
  push:
    branches: [ram-overlay]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ram-overlay-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to ram-overlay-apk branch
        run: |
          mkdir /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/RamOverlay.apk
          cd /tmp/out && git init -q -b ram-overlay-apk && git add . \
            && git -c user.name=ci -c user.email=ci@example.com commit -qm "RamOverlay apk" \
            && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ram-overlay-apk
